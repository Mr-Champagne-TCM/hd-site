<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Human Design readings by The Champagne Method Coaching and Consulting</title>
    <meta
      name="description"
      content="A Human Design chart computed from the moment you were born, with a written interpretation. Measured against NASA's JPL ephemeris."
    />
    <!-- Open Graph (site audit FIND-19, approved 9/9 as #9). The shop travels by
         shared links, and with no tags at all every one arrived as a bare URL.
         Brand calls 10/16 (B1): title and og:title say whose readings these
         are; og:site_name is the business, "Coaching and Consulting" included.
         THE PICTURE: public/og-preview.png is a TEMPORARY copy of mock option C
         (og-C-name.png). The final picture is being designed separately and
         REPLACES that file at the same path, 1200x630, so these tags do not
         change. Scrapers want an absolute URL, hence the full address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Champagne Method Coaching and Consulting" />
    <meta property="og:url" content="https://humandesign.thechampagnemethod.co/" />
    <meta property="og:title" content="Human Design readings by The Champagne Method Coaching and Consulting" />
    <meta
      property="og:description"
      content="A Human Design chart computed from the moment you were born, with a written interpretation. Measured against NASA's JPL ephemeris."
    />
    <meta property="og:image" content="https://humandesign.thechampagnemethod.co/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
