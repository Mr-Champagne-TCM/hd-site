    <!-- Open Graph (site audit FIND-19, approved 9/9 as #9). The shop travels by
         shared links, and with no tags at all every one arrived as a bare URL.
         Brand calls 10/16 (B1): title and og:title say whose readings these
         are; og:site_name is the business, "Coaching and Consulting" included.
         THE PICTURE: public/og-preview.png is option 6 of the preview-picture
         mock (og-D-mix.png: the example bodygraph above "Human Design by The
         Champagne Method"), chosen by Jeremy 10/16. 1200x630, under 1 MB.
         Scrapers want an absolute URL, hence the full address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Champagne Method Coaching and Consulting" />
    <meta property="og:url" content="https://humandesign.thechampagnemethod.co/" />
    <meta property="og:title" content="Human Design readings by The Champagne Method Coaching and Consulting" />
    <meta
      property="og:description"
      content="A Human Design chart worked out from when and where you were born, with a written interpretation. Checked against NASA’s own record of where the planets were."
    />
    <meta property="og:image" content="https://humandesign.thechampagnemethod.co/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Human Design by The Champagne Method: an example bodygraph" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
