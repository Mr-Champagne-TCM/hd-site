# What did we just publish?
#
# The same scan the pre-commit hook runs, run again where nobody can skip it
# with --no-verify, and run against the BUILT output as well as the source --
# which matters more, because source can look clean while a bundler inlines
# something from outside it.
#
# THIS WORKFLOW FAILED ON EVERY PUSH FOR A DAY AND A HALF and the failure was
# invisible from the machine doing the pushing: the notices went to the TCM
# inbox, not the one the tooling could read.
#
# The cause was ordering. Tests ran BEFORE `npm ci`, so node_modules did not
# exist, and the two tests that shell out to esbuild to compile TypeScript died
# with MODULE_NOT_FOUND. Steps run in sequence and a failure aborts the job, so
# the three steps after it never ran at all -- including the search of the built
# output, which is the entire reason this file exists. A guard that fails before
# it reaches the guarding is worth less than no guard, because it still reports
# a status and still looks like coverage.
#
# Dependencies are installed first now, and every step that could quietly find
# nothing to do says so loudly instead.
name: publish-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  nothing-hidden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deep enough to see the messages of the commits being pushed. The
          # default shallow clone has one commit and no range to compare.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # First, because everything below needs it. This is the whole bug.
      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      # THE NAME RULE, WHICH UNTIL NOW HAS NEVER RUN HERE.
      #
      # The scanner spots a key or an email address by SHAPE. It cannot spot a
      # name, because a name looks like ordinary text -- so it has to be handed
      # a list. On Jeremy's machine that list is tools/private-terms.local.txt,
      # which is gitignored and therefore is NOT in this checkout. Without this
      # variable every push here was scanned with that rule switched off, and
      # said so in a line nobody was reading.
      #
      # SAFE TO FAIL IN PUBLIC, and only recently. A GitHub Actions log on a
      # public repository is world-readable, so a scanner that quoted the
      # offending line would publish the very name it had just caught. It
      # withholds the line for this rule alone -- see tools/leak-scan.mjs. That
      # fix is what makes putting this list into CI defensible at all.
      - name: Search the source
        env:
          LEAK_SCAN_TERMS: ${{ secrets.LEAK_SCAN_TERMS }}
        run: node tools/leak-scan.mjs .

      # A rule that is switched off must not look like a rule that passed.
      # This is the same failure the header of this file is about: a guard that
      # reports a green status while guarding nothing is worth less than no
      # guard, because it gets counted as coverage.
      - name: The name rule is armed
        env:
          LEAK_SCAN_TERMS: ${{ secrets.LEAK_SCAN_TERMS }}
        run: |
          if [ -z "${LEAK_SCAN_TERMS}" ]; then
            echo "::error::LEAK_SCAN_TERMS is empty, so client names were NOT checked."
            echo "Set it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # The COUNT is the useful part and the list is not, so only the count
          # is ever printed. This log is public.
          count=$(printf '%s' "$LEAK_SCAN_TERMS" | tr ',' '\n' | grep -c '[^[:space:]]' || true)
          echo "name rule armed: ${count} term(s) loaded"

      # A COMMIT MESSAGE IS PUBLISHED AS PERMANENTLY AS A FILE, and until now
      # nothing looked at one. The commit-msg hook catches these locally;
      # this catches them when the hook was skipped with --no-verify, which is
      # the same reason the file scan runs here as well as there.
      #
      # ONLY THE COMMITS IN THIS PUSH. Scanning all history would pin the build
      # red on something already published, which cannot be fixed by a commit
      # and would end with the step being deleted.
      #
      # The SHA comes through the environment rather than being interpolated
      # into the script. It is a hash and safe either way, but commit messages
      # next to it are attacker-controlled text, and shell interpolation of
      # anything from a webhook payload is a habit worth not having.
      - name: The messages are published too
        env:
          BEFORE: ${{ github.event.before }}
          LEAK_SCAN_TERMS: ${{ secrets.LEAK_SCAN_TERMS }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git log --format=%B "${BEFORE}..HEAD" > commit-messages.txt
          else
            # A new branch, a force push, or a first commit: no usable range.
            git log --format=%B -n 1 > commit-messages.txt
          fi
          echo "scanning $(grep -c '' commit-messages.txt) line(s) of commit message"
          node tools/leak-scan.mjs commit-messages.txt
          rm -f commit-messages.txt

      - name: Build
        run: npm run build

      # The step that matters most, and the one that has never run. A missing
      # dist is now a failure rather than a shrug: "no dist yet" printed in
      # green is indistinguishable from a scan that found nothing.
      - name: Search the built output
        env:
          LEAK_SCAN_TERMS: ${{ secrets.LEAK_SCAN_TERMS }}
        run: |
          if [ ! -d dist ]; then
            echo "::error::dist/ is missing, so the built output was never scanned"
            exit 1
          fi
          node tools/leak-scan.mjs dist
