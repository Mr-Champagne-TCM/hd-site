# Netlify, not Cloudflare, for one reason: it attaches to a custom domain with a
# single CNAME, while Cloudflare Workers wants the whole zone's nameservers.
# thechampagnemethod.co stays on Porkbun DNS pointing at GitHub Pages, untouched,
# and one record is added. Deleting that one record undoes everything.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# THE FONTS ARE COMPILED INTO SOURCE, so nothing needs to be shipped beside the
# code any more.
#
# `included_files = ["netlify/lib/fonts/**"]` used to live here, and it applied
# to EVERY function -- so `warm`, whose whole job is one ping, carried 260 KB of
# TrueType and 150 KB of base64 it could never use. Measured by unzipping the
# built bundles: eight functions, three font files each, one of them drawing a
# PDF.
#
# `external_node_modules` is scoped to the one function that needs it, for the
# same reason. pdfkit is 11 MB and only /api/pdf imports it.
[functions.pdf]
  external_node_modules = ["pdfkit", "fontkit", "svg-to-pdfkit"]

# The free chart endpoint is metered per visitor. See netlify/lib/ratelimit.mjs.

# A delivered reading is served by the single-page app, so /r/<token> has to
# return index.html rather than a 404 -- there is no file at that path and there
# never will be. The token is read from the address bar by main.tsx.
#
# Scoped to /r/* rather than a catch-all: a blanket SPA fallback would turn
# every genuine 404 into a silent 200 with an offer page in it, which is how a
# broken link stops looking broken.
[[redirects]]
  from = "/r/*"
  to = "/index.html"
  status = 200
